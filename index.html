<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PV5 Wood Studio</title>
  <style>
    :root{color-scheme:dark;--bg:#111614;--panel:#19211e;--line:#34453e;--mint:#86c6a9;--oak:#c5965c;--text:#edf4f0;--muted:#9db0a7}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",sans-serif;overflow:hidden}
    #app{height:100vh;display:grid;grid-template-columns:300px 1fr}.panel{padding:22px 18px;overflow:auto;background:linear-gradient(180deg,#1c2622,#151c19);border-right:1px solid var(--line);z-index:3}
    h1{font-size:21px;margin:0 0 5px}.subtitle{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:18px}.label{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:18px 0 8px}
    .plans{display:grid;gap:7px}.plans button,.view-btn{border:1px solid var(--line);background:#202c27;color:var(--text);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}.plans button:hover,.plans button.active,.view-btn:hover{border-color:var(--mint);background:#263831}
    .checks{display:grid;gap:9px;font-size:13px}.checks label{display:flex;gap:9px;align-items:center}.checks input{accent-color:var(--mint)}
    .spec{margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#121916;font-size:12px;line-height:1.65;color:#cbd8d2}.spec strong{color:#fff}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px;font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
    #stage{position:relative;min-width:0} canvas{display:block;width:100%;height:100%}.topbar{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;pointer-events:none}.badge{background:#101714d9;border:1px solid #3b5047;border-radius:999px;padding:8px 12px;font-size:12px;backdrop-filter:blur(8px)}
    .hint{position:absolute;right:18px;bottom:16px;background:#101714d9;border:1px solid #3b5047;border-radius:10px;padding:9px 11px;color:var(--muted);font-size:11px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#111614;z-index:5;color:var(--muted)}
    @media(max-width:760px){#app{grid-template-columns:1fr}.panel{position:absolute;width:min(86vw,310px);height:100%;box-shadow:12px 0 30px #0008}.panel.collapsed{transform:translateX(-100%)}#menu{display:block!important}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <aside class="panel" id="panel">
    <h1>PV5 Wood Studio</h1>
    <div class="subtitle">PV5 카고를 이동형 사무실로 구성하는 3D 배치 시뮬레이터</div>
    <div class="label">배치안</div>
    <div class="plans">
      <button data-plan="1">1안 · 후면 데스크 + 횡방향 침상</button>
      <button data-plan="2">2안 · 우측 데스크 + 종방향 침상</button>
      <button data-plan="3" class="active">3안 · 후면 수납함 통합</button>
    </div>
    <div class="label">표시</div>
    <div class="checks">
      <label><input id="personToggle" type="checkbox" checked /> 163cm 착석 인체</label>
      <label><input id="storageToggle" type="checkbox" /> 침상 수납 열기 · 우유상자 8개</label>
      <label><input id="shellToggle" type="checkbox" checked /> 차량 외곽선</label>
    </div>
    <div class="label">카메라</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
      <button class="view-btn" data-view="iso">사선</button><button class="view-btn" data-view="top">평면</button>
      <button class="view-btn" data-view="door">슬라이드도어</button><button class="view-btn" data-view="rear">트렁크</button>
    </div>
    <div class="spec" id="spec"></div>
    <div class="legend"><span><i class="dot" style="background:#c5965c"></i>오크 가구</span><span><i class="dot" style="background:#659e82"></i>좌방석</span><span><i class="dot" style="background:#202527"></i>장비</span><span><i class="dot" style="background:#333"></i>정원형 바퀴</span></div>
  </aside>
  <main id="stage">
    <div class="loading" id="loading">3D 장면을 불러오는 중…</div>
    <div class="topbar"><div class="badge" id="planBadge">3안 · 후면 수납함 통합</div><button id="menu" class="badge" style="display:none;pointer-events:auto;color:white">메뉴</button></div>
    <div class="hint">드래그: 회전 · 휠: 확대/축소 · 우클릭: 이동</div>
  </main>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const stage=document.querySelector('#stage');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x111614); scene.fog=new THREE.Fog(0x111614,5.5,11);
const camera=new THREE.PerspectiveCamera(42,1,.01,50); camera.position.set(3.6,2.65,3.8);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; stage.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.target.set(0,.45,0); controls.minDistance=2.4; controls.maxDistance=8;
scene.add(new THREE.HemisphereLight(0xdcece5,0x343128,2.1)); const sun=new THREE.DirectionalLight(0xfff1d8,3.2); sun.position.set(-3,5,3); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); scene.add(sun);

const colors={oak:0xc5965c,oakDark:0x8f633a,mattress:0x659e82,cushion:0xd8b075,bean:0x6d785f,metal:0x272d2c,screen:0x162b31,crate:0x4779a7,skin:0xd7a57c,shirt:0x4f796b,pants:0x2c3e46,white:0xe8ece9};
const M={}; Object.entries(colors).forEach(([k,v])=>M[k]=new THREE.MeshStandardMaterial({color:v,roughness:k==='metal'?.35:.75,metalness:k==='metal'?.5:0}));
const current={plan:3,person:true,storageOpen:false,shell:true}; let planRoot,personRoot,storageRoot,shellRoot;
const mm=v=>v/1000;
function box(name,w,h,d,x,y,z,mat=M.oak,round=false){const g=new THREE.BoxGeometry(w,h,d,round?4:1,round?2:1,round?4:1); const m=new THREE.Mesh(g,mat);m.name=name;m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m}
function cyl(name,r,len,x,y,z,mat=M.metal,axis='x'){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,48),mat);m.name=name;m.position.set(x,y,z);if(axis==='x')m.rotation.z=Math.PI/2;if(axis==='z')m.rotation.x=Math.PI/2;m.castShadow=true;return m}
function add(group,...items){items.flat().forEach(v=>v&&group.add(v));return group}
function label(text,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#f4f8f6';ctx.font='600 44px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,74);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.position.set(x,y,z);s.scale.set(1.1,.275,1);return s}

function vehicle(){const g=new THREE.Group();g.name='PV5 vehicle';
  add(g,box('cargo floor',1.565,.045,2.255,0,.022,0,new THREE.MeshStandardMaterial({color:0x7d6952,roughness:.9})),box('bulkhead',1.565,1.45,.035,0,.75,-1.145,new THREE.MeshStandardMaterial({color:0xaab4af,transparent:true,opacity:.18})),box('left wall',.035,1.35,2.255,-.8,.7,0,new THREE.MeshStandardMaterial({color:0x9aa9a2,transparent:true,opacity:.12})),box('right rail',.035,.38,2.255,.8,.2,0,new THREE.MeshStandardMaterial({color:0x9aa9a2,transparent:true,opacity:.12})));
  const lineMat=new THREE.LineBasicMaterial({color:0x739687,transparent:true,opacity:.65});const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.62,1.52,2.34)),lineMat);edges.position.y=.76;g.add(edges);
  [-1,1].forEach(side=>[-.73,.72].forEach(z=>{const wheel=cyl('full circular wheel',.36,.17,side*.89,.36,z,M.metal,'x');g.add(wheel);const hub=cyl('wheel hub',.17,.182,side*.89,.36,z,new THREE.MeshStandardMaterial({color:0x8d9692,metalness:.7,roughness:.25}),'x');g.add(hub)}));
  return g;
}

function deskRear(g){add(g,box('rear desk top',1.54,.035,.70,0,.65,.78),box('left desk support',.05,.61,.66,-.72,.325,.78,M.oakDark),box('right desk support',.05,.61,.66,.72,.325,.78,M.oakDark));monitor(g,-.34,.67,.84,'rear');laptop(g,.36,.67,.83,'rear')}
function deskSide(g,plan3=false){add(g,box('right desk top',.70,.035,1.10,.4325,.65,.26),box('slide door solid support',.65,.61,.045,.46,.325,-.27,M.oakDark));if(!plan3)add(g,box('rear desk support',.45,.61,.045,.56,.325,.79,M.oakDark));monitor(g,.29,.67,.02,'side');laptop(g,.29,.67,.50,'side')}
function monitor(g,x,y,z,side){const arm=new THREE.Group();add(arm,cyl('monitor pole',.022,.32,x,y+.16,z,M.metal,'y'),box('monitor arm',.035,.035,.25,x,y+.28,z-.10,M.metal));const mon=box('27 inch monitor',.62,.38,.035,x,y+.42,z-.24,M.screen);if(side==='side'){mon.rotation.y=Math.PI/2;mon.position.set(x-.20,y+.42,z-.08)}add(g,arm,mon)}
function laptop(g,x,y,z,side){const base=box('laptop stand',.30,.025,.24,x,y+.035,z,M.metal);const screen=box('laptop',.32,.22,.022,x,y+.16,z-.09,M.screen);screen.rotation.x=-.18;if(side==='side'){base.rotation.y=Math.PI/2;screen.rotation.set(-.18,Math.PI/2,0)}add(g,base,screen)}
function mattress(g,w,d,x,z){add(g,box('bed frame',w,.30,d,x,.20,z,M.oakDark),box('mattress',w,.10,d,x,.35,z,M.mattress,true))}
function cushions(g,z){add(g,box('upright wedge cushion',.24,.52,.50,-.64,.66,z,M.cushion,true));const bean=new THREE.Mesh(new THREE.SphereGeometry(.28,28,18),M.bean);bean.scale.set(.8,1.05,1);bean.position.set(-.57,.55,z+.42);bean.castShadow=true;g.add(bean)}
function storage(g){const s=new THREE.Group();s.name='rear full-width storage';add(s,box('storage carcass',1.465,.62,.40,0,.31,.9275,M.oakDark),box('storage top extension',.75,.035,.40,-.3575,.65,.9275,M.oak));
  const openings=[[-.43,.29],[.30,.29]];openings.forEach(([x,y])=>{const dark=box('rounded through opening',.55,.34,.415,x,y,.9275,new THREE.MeshStandardMaterial({color:0x171b1a}),true);s.add(dark)});const ps=box('PS5',.10,.36,.25,.30,.28,.91,M.white,true);s.add(ps);return s}
function cratesAndDoors(g){const root=new THREE.Group();root.name='8 milk crates and lift doors';const zs=[-.88,-.53,-.18,.17,.52];let count=0;[[-.28,z=>true],[.28,z=>z<.2]].forEach(([x,ok])=>zs.forEach(z=>{if(ok(z)&&count<8){const c=box('milk crate '+(++count),.32,.27,.32,x,.145,z,M.crate);const wire=new THREE.LineSegments(new THREE.EdgesGeometry(c.geometry),new THREE.LineBasicMaterial({color:0xb4d2ea}));wire.position.copy(c.position);add(root,c,wire)}}));
  for(let i=0;i<5;i++){const door=box('lift-up bed door',.91,.045,.34,-.14,.56,-.91+i*.35,M.oak);door.rotation.x=-1.0;door.position.y=.56;door.position.z=-.84+i*.35;root.add(door)}g.add(root);return root}

function limb(a,b,r,mat){const mid=a.clone().add(b).multiplyScalar(.5);const len=a.distanceTo(b);const m=cyl('limb',r,len,mid.x,mid.y,mid.z,mat,'y');m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());return m}
function person(plan){const p=new THREE.Group();p.name='163cm seated person';const side=plan===1?'rear':'side';const hip=side==='rear'?new THREE.Vector3(0,.54,.12):new THREE.Vector3(-.04,.54,.36);if(plan===3)hip.z=.49;
  const torso=box('torso',.30,.45,.20,hip.x,hip.y+.30,hip.z,M.shirt,true);if(side==='side')torso.rotation.y=Math.PI/2;const head=new THREE.Mesh(new THREE.SphereGeometry(.12,28,18),M.skin);head.position.set(hip.x,1.02,hip.z);head.castShadow=true;add(p,torso,head,label('163cm',hip.x,1.25,hip.z));
  if(side==='rear'){const lk=new THREE.Vector3(-.12,.39,.46),rk=new THREE.Vector3(.12,.39,.46),lf=new THREE.Vector3(-.12,.10,.57),rf=new THREE.Vector3(.12,.10,.57);add(p,limb(hip.clone().add(new THREE.Vector3(-.09,0,0)),lk,.055,M.pants),limb(hip.clone().add(new THREE.Vector3(.09,0,0)),rk,.055,M.pants),limb(lk,lf,.05,M.pants),limb(rk,rf,.05,M.pants));}
  else{const lk=new THREE.Vector3(.18,.40,hip.z),rk=new THREE.Vector3(.20,.40,hip.z+.04),lf=new THREE.Vector3(.40,.10,hip.z),rf=new THREE.Vector3(.43,.10,hip.z+.04);add(p,limb(hip.clone().add(new THREE.Vector3(.08,0,-.07)),lk,.055,M.pants),limb(hip.clone().add(new THREE.Vector3(.08,0,.07)),rk,.055,M.pants),limb(lk,lf,.05,M.pants),limb(rk,rf,.05,M.pants));}
  const shoulder=side==='rear'?new THREE.Vector3(0,.91,.12):new THREE.Vector3(0,.91,hip.z);const le=side==='rear'?new THREE.Vector3(-.25,.76,.45):new THREE.Vector3(.24,.75,hip.z-.12);const re=plan===3?new THREE.Vector3(.22,.665,.78):(side==='rear'?new THREE.Vector3(.25,.76,.45):new THREE.Vector3(.24,.75,hip.z+.13));const lh=side==='rear'?new THREE.Vector3(-.18,.68,.67):new THREE.Vector3(.35,.68,hip.z-.05);const rh=plan===3?new THREE.Vector3(.38,.68,.60):(side==='rear'?new THREE.Vector3(.18,.68,.67):new THREE.Vector3(.35,.68,hip.z+.05));add(p,limb(shoulder.clone().add(new THREE.Vector3(-.12,0,0)),le,.043,M.shirt),limb(le,lh,.038,M.skin),limb(shoulder.clone().add(new THREE.Vector3(.12,0,0)),re,.043,M.shirt),limb(re,rh,.038,M.skin));return p}

function build(plan){if(planRoot)scene.remove(planRoot);planRoot=new THREE.Group();planRoot.name='layout '+plan;
  if(plan===1){mattress(planRoot,1.065,1.48,-.25,-.27);deskRear(planRoot)}
  if(plan===2){mattress(planRoot,.965,1.90,-.30,.1775);deskSide(planRoot);cushions(planRoot,-.58)}
  if(plan===3){mattress(planRoot,.965,1.815,-.30,-.22);deskSide(planRoot,true);cushions(planRoot,-.70);storageRoot=storage(planRoot);planRoot.add(storageRoot);if(current.storageOpen)cratesAndDoors(planRoot)}
  if(current.person){personRoot=person(plan);planRoot.add(personRoot)} scene.add(planRoot);updateUi()}
function updateUi(){const names={1:'1안 · 후면 데스크 + 횡방향 침상',2:'2안 · 우측 데스크 + 종방향 침상',3:'3안 · 후면 수납함 통합'};document.querySelector('#planBadge').textContent=names[current.plan];document.querySelectorAll('[data-plan]').forEach(b=>b.classList.toggle('active',+b.dataset.plan===current.plan));document.querySelector('#storageToggle').disabled=current.plan!==3;const specs={1:'<strong>1안</strong><br>책상 1,540 × 700mm · 높이 650mm<br>침상 폭 1,065mm · 우측 통로 500mm<br>침상–책상 겹침 100mm',2:'<strong>2안</strong><br>우측 책상 1,100 × 700mm<br>침상 길이 1,900mm · 높이 400mm<br>책상–침상 겹침 100mm',3:'<strong>3안</strong><br>수납함 1,465 × 400mm · 높이 650mm<br>침상 길이 1,815mm · 우유상자 8개<br>오른쪽 팔꿈치: 수납함 상판 위'};document.querySelector('#spec').innerHTML=specs[current.plan]}

shellRoot=vehicle();scene.add(shellRoot);build(3);
const ground=box('ground',8,.04,8,0,-.06,0,new THREE.MeshStandardMaterial({color:0x0c100f,roughness:1}));ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(8,32,0x33423c,0x202b27);grid.position.y=-.035;scene.add(grid);
document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{current.plan=+b.dataset.plan;build(current.plan)});document.querySelector('#personToggle').onchange=e=>{current.person=e.target.checked;build(current.plan)};document.querySelector('#storageToggle').onchange=e=>{current.storageOpen=e.target.checked;build(current.plan)};document.querySelector('#shellToggle').onchange=e=>{current.shell=e.target.checked;shellRoot.visible=current.shell};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;const poses={iso:[3.6,2.65,3.8],top:[0,5.2,.01],door:[3.8,1.6,0],rear:[0,1.5,4.2]};camera.position.fromArray(poses[v]);controls.target.set(0,.45,0);controls.update()});document.querySelector('#menu').onclick=()=>document.querySelector('#panel').classList.toggle('collapsed');
function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',resize);resize();document.querySelector('#loading').remove();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
